<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jolomi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h2 class="logo">Jolomi</h2>
            <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="planner.html">Planner</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Me</h2>
            <p>Send me a message and I will get back to you.</p>

            <form id="contact-form" novalidate>
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name">
                <p class="error" id="name-error"></p>

                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="you@example.com">
                <p class="error" id="email-error"></p>

                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="08012345678">
                <p class="error" id="phone-error"></p>

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Type your message"></textarea>
                <p class="error" id="message-error"></p>

                <button type="submit">Send Message</button>
                <p class="success" id="success-msg"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jolomi. All rights reserved.</p>
    </footer>

    <script src="js/contact.js"></script>
</body>
</html>
